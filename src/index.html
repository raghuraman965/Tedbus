  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    // Applies saved theme before Angular boots, to avoid a flash of the
    // wrong theme. Reads the same key the ThemeService uses at runtime.
    (function () {
      try {
        var saved = localStorage.getItem('tedbus-theme');
        var theme;
        if (saved === 'dark' || saved === 'light') {
          theme = saved;
        } else if (saved === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          theme = 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* localStorage unavailable, default light theme applies via CSS */ }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>
</html>
