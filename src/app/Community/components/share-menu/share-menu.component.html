<button class="action-btn share-trigger" [matMenuTriggerFor]="shareMenu" (click)="$event.stopPropagation()">
  <mat-icon>share</mat-icon>
  <span *ngIf="!copied && count === undefined">{{ 'community.share' | translate }}</span>
  <span *ngIf="!copied && count !== undefined">{{ count }}</span>
  <span *ngIf="copied" class="copied-label">{{ 'community.copied' | translate }}</span>
</button>

<mat-menu #shareMenu="matMenu" class="share-menu-panel">
  <button mat-menu-item *ngIf="supportsNativeShare" (click)="shareTo('native')" class="share-item">
    <span matMenuItemIcon class="share-icon native">
      <mat-icon>ios_share</mat-icon>
    </span>
    <span>{{ 'community.shareVia' | translate }}</span>
  </button>

  <button mat-menu-item (click)="shareTo('whatsapp')" class="share-item">
    <span matMenuItemIcon class="share-icon whatsapp">

    </span>
    <span>{{ 'community.sharePlatforms.whatsapp' | translate }}</span>

  <button mat-menu-item (click)="shareTo('facebook')" class="share-item">
    <span matMenuItemIcon class="share-icon facebook">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
    </span>
    <span>{{ 'community.sharePlatforms.facebook' | translate }}</span>
  </button>

  <button mat-menu-item (click)="shareTo('telegram')" class="share-item">
    <span matMenuItemIcon class="share-icon telegram">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#229ED9" aria-hidden="true">
        <path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
    </span>
    <span>{{ 'community.sharePlatforms.telegram' | translate }}</span>
  </button>

  <button mat-menu-item (click)="shareTo('x')" class="share-item">
    <span matMenuItemIcon class="share-icon x">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#0F1419" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </span>
    <span>{{ 'community.sharePlatforms.x' | translate }}</span>
  </button>

  <button mat-menu-item (click)="shareTo('copy')" class="share-item">
    <span matMenuItemIcon class="share-icon copy">
      <mat-icon>link</mat-icon>
    </span>
    <span>{{ 'community.copyLink' | translate }}</span>
  </button>
</mat-menu>

<div class="instagram-hint" *ngIf="instagramHint">
  {{ 'community.instagramHint' | translate }}
</div>
