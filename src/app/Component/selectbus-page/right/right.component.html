<div>
    <app-sorting-bar></app-sorting-bar>

    <ng-container *ngIf="loading">
        <div class="skeleton-card" *ngFor="let i of [1,2,3]">
            <div class="skeleton-top">
                <div class="skeleton-premium skeleton-avatar"></div>
                <div class="skeleton-lines">
                    <div class="skeleton-premium skeleton-line" style="width: 55%; height: 18px;"></div>
                    <div class="skeleton-premium skeleton-line" style="width: 35%; height: 12px; margin-top: 8px;"></div>
                </div>
            </div>
            <div class="skeleton-premium skeleton-line" style="width: 100%; height: 40px; margin-top: 18px;"></div>
        </div>
    </ng-container>

    <div class="error-banner" *ngIf="!loading && errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
    </div>

    <div class="empty-state" *ngIf="!loading && !errorMessage && matchedbus.length === 0">
        <div class="empty-illustration">
            <mat-icon>no_transfer</mat-icon>
        </div>
        <p class="empty-title">{{ 'search.noBuses' | translate }}</p>
        <p class="empty-subtitle">{{ 'classic.noBusesSubtitle' | translate }}</p>
    </div>

    <div *ngFor="let bus of matchedbus; index as i; trackBy: trackByBusId">
        <div *ngFor="let key of getkeys(); trackBy: trackByKey">
            <div *ngIf="bus._id === key">
                <app-bus-box [rating]='bus.rating' [reviewStats]="reviewStats[bus._id || '']" [busid]="bus._id" [operatorname]="bus.operatorName" [bustype]="bus.busType"
                    [departuretime]="bus.departureTime" [livetracking]="bus.liveTracking" [reschedulable]="bus.reschedulable" [filledseats]="seats[key]"
                    [routedetails]="routes" [date]="date" [routeId]="getRouteId()" (seatsTaken)="onSeatsTaken(bus._id, $event)"></app-bus-box>
            </div>
        </div>
    </div>
</div>
