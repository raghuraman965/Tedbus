<h2 mat-dialog-title>{{ 'classic.dialogTitle' | translate }} </h2>
<mat-dialog-content class="mat-typography">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> {{ 'classic.dialogNo' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> {{ 'common.from' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.from | cityName}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> {{ 'common.to' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.to | cityName}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="nobus">
      <th mat-header-cell *matHeaderCellDef> {{ 'classic.dialogNoOfBuses' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.nobus}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>




</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
</mat-dialog-actions>
